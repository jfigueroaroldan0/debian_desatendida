#_preseed_V1
#### Archivo de preconfiguración Debian 13 (trixie)
#### Instalación desatendida desde USB, compatible con BIOS y UEFI
#### Particionado LVM por porcentajes con particiones.sh
#### Escritorio GNOME

### Idioma y teclado
# Idioma del instalador y del sistema: español
d-i debian-installer/language string es
# País: España
d-i debian-installer/country string ES
# Locale del sistema
d-i debian-installer/locale string es_ES.UTF-8
# Distribución de teclado española
d-i keyboard-configuration/xkb-keymap select es

### Red
# Selecciona automáticamente la primera interfaz de red con enlace
d-i netcfg/choose_interface select auto
# Tiempo máximo de espera al servidor DHCP
d-i netcfg/dhcp_timeout string 60
# Nombre del equipo
d-i netcfg/get_hostname string debian
# Dominio vacío
d-i netcfg/get_domain string
# Fuerza el nombre de equipo, ignorando el que dé el DHCP.
# Por HTTP la red se configura antes de leer este fichero, así que hay que
# pasarlo también en el arranque: hostname=debian domain=
d-i netcfg/hostname string debian
# Sin configuración WEP para redes inalámbricas
d-i netcfg/wireless_wep string

### Firmware
# Carga el firmware no libre que haga falta sin preguntar
d-i hw-detect/load_firmware boolean true

### Mirror de paquetes
# Mirror definido a mano
d-i mirror/country string manual
# Servidor oficial de Debian (redirige al más cercano)
d-i mirror/http/hostname string deb.debian.org
# Directorio del repositorio
d-i mirror/http/directory string /debian
# Sin proxy
d-i mirror/http/proxy string

### Cuentas de usuario
# Contraseña de root cifrada en SHA-512 (root)
d-i passwd/root-password-crypted password $6$jxQqu7.ow8K03jLA$WWWXNvc9Wppfz3eyE5mFfh5gft7nbUV5Ky.hgRRV3w9Lzm0lhtyx3MurHQfmkvh43umFreZW3ZY0cqtpeIGll0
# Nombre completo del usuario normal
d-i passwd/user-fullname string debian
# Nombre de inicio de sesión del usuario normal
d-i passwd/username string debian
# Contraseña del usuario normal cifrada en SHA-512 (debian)
d-i passwd/user-password-crypted password $6$cE7b/0iPAgGcfCCI$4yO59n309S1uKrcs3uC77FCNuZrxQu/Df8QUzwaj6E00SEhMdQyaJdagF7/b1BEMkh6RGQ9ncuA376lJoAe4S1
# Grupos del usuario normal, incluido sudo
d-i passwd/user-default-groups string audio cdrom video plugdev netdev sudo

### Reloj y zona horaria
# El reloj del hardware se guarda en UTC
d-i clock-setup/utc boolean true
# Zona horaria de España
d-i time/zone string Europe/Madrid
# Sincroniza la hora por NTP
d-i clock-setup/ntp boolean true

### Particionado
# particiones.sh elige el disco (descartando el USB de instalación), calcula
# los tamaños y prepara la receta de partman.
# Desde la ISO ya está en /particiones.sh; si el preseed se carga por HTTP,
# se descarga del mismo directorio del servidor que el preseed.cfg
d-i partman/early_command string \
    [ -f /particiones.sh ] || \
    wget -q -O /particiones.sh "$(dirname "$(debconf-get preseed/url)")/particiones.sh"; \
    sh /particiones.sh
# Particionado con LVM
d-i partman-auto/method string lvm
# El grupo de volúmenes ocupa todo el espacio disponible
d-i partman-auto-lvm/guided_size string max
# Nombre del grupo de volúmenes
d-i partman-auto-lvm/new_vg_name string vg-debian
# Elimina los volúmenes LVM de instalaciones anteriores
d-i partman-auto/purge_lvm_from_device boolean true
# Borra sin preguntar cualquier LVM previo del disco
d-i partman-lvm/device_remove_lvm boolean true
# Borra sin preguntar los grupos LVM previos aunque ocupen varios discos
d-i partman-lvm/device_remove_lvm_span boolean true
# Borra sin preguntar cualquier RAID previo del disco
d-i partman-md/device_remove_md boolean true
# Confirma la escritura de los volúmenes LVM
d-i partman-lvm/confirm boolean true
# Confirma la escritura LVM aunque no se sobrescriba nada
d-i partman-lvm/confirm_nooverwrite boolean true
# En UEFI, si el disco tenía un sistema BIOS, sigue en UEFI sin preguntar
d-i partman-efi/non_efi_system boolean true
# Confirma la nueva tabla de particiones
d-i partman-partitioning/confirm_write_new_label boolean true
# Termina el particionado sin pasar por el menú
d-i partman/choose_partition select finish
# Confirma la escritura de los cambios en el disco
d-i partman/confirm boolean true
# Confirma la escritura aunque no se sobrescriban particiones
d-i partman/confirm_nooverwrite boolean true
# Monta las particiones por UUID en /etc/fstab
d-i partman/mount_style select uuid

### Configuración de APT
# No pregunta por más CD/DVD
d-i apt-setup/cdrom/set-first boolean false
# Usa el mirror de red
d-i apt-setup/use_mirror boolean true
# Quita el USB de instalación de las fuentes de APT
d-i apt-setup/disable-cdrom-entries boolean true
# Repositorios non-free-firmware, non-free y contrib
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
# Repositorios de seguridad y actualizaciones
d-i apt-setup/services-select multiselect security, updates

### Selección de paquetes
# Sistema estándar, escritorio GNOME y servidor SSH
tasksel tasksel/first multiselect standard, gnome-desktop, ssh-server
# Paquetes adicionales:
#  - Flatpak y el plugin de GNOME Software para instalar apps de Flathub
#    desde la aplicación Software
#  - Servidor SSH
#  - Utilidades básicas de sistema, red y administración
#  - Firmware de las tarjetas wifi más comunes (Intel, Realtek, Atheros,
#    Broadcom y MediaTek)
d-i pkgsel/include string flatpak gnome-software gnome-software-plugin-flatpak \
    openssh-server \
    sudo curl wget ca-certificates gnupg vim nano htop tree git \
    zip unzip rsync lsof man-db bash-completion \
    net-tools bind9-dnsutils iw wireless-regdb \
    firmware-iwlwifi firmware-realtek firmware-atheros \
    firmware-brcm80211 firmware-misc-nonfree
# Actualiza todos los paquetes
d-i pkgsel/upgrade select full-upgrade
# Sin actualizaciones automáticas (no pregunta)
d-i pkgsel/update-policy select none
# No participa en la encuesta de popularidad
popularity-contest popularity-contest/participate boolean false

### Cargador de arranque
# Instala GRUB sin preguntar (el disco lo fija particiones.sh)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
# En UEFI copia GRUB también a la ruta genérica, por si el firmware pierde la entrada
d-i grub-installer/force-efi-extra-removable boolean true

### Fin de la instalación
# Guarda el registro del particionado, configura sudo sin contraseña para
# debian, se asegura de que flatpak y el plugin de GNOME Software están
# instalados y añade el repositorio Flathub (aparece en la app Software)
d-i preseed/late_command string \
    cp /var/log/particiones.log /target/var/log/; \
    echo 'debian ALL=(ALL:ALL) NOPASSWD: ALL' > /target/etc/sudoers.d/debian; \
    chmod 0440 /target/etc/sudoers.d/debian; \
    in-target apt-get install -y flatpak gnome-software-plugin-flatpak; \
    in-target flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo; \
    true
# Se salta el mensaje final
d-i finish-install/reboot_in_progress note
# Apaga el equipo al terminar, para quitar el USB y que no vuelva a instalar
d-i debian-installer/exit/poweroff boolean true
